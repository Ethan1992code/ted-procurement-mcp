<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的查询订单 · TED</title><style>body{font:16px/1.7 system-ui;background:#f5f7f2;color:#173c35;margin:0}main{max-width:920px;margin:40px auto;padding:24px}article,.status{padding:24px;background:white;border:1px solid #dce6e1;border-radius:12px;margin:16px 0}button,a{color:#176756}button{padding:12px 24px;background:white;border:1px solid #176756;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui}.muted{color:#61746b}</style><main><a href="/shop">← 返回查询</a><h1>我的查询订单</h1><p class="muted">请保留本页面，并使用下单时的浏览器打开。页面跳转不代表付款成功。</p><div class="status" id="state">正在确认订单状态…</div><button id="refresh">刷新付款与结果状态</button><div id="results"></div></main><script>
const order=new URLSearchParams(location.search).get('order');let running=false;
async function update(){if(running)return;const s=document.getElementById('state');if(!order){s.textContent='请从查询页面创建订单，或在原浏览器打开保存的订单记录。';return}running=true;document.getElementById('refresh').disabled=true;try{const r=await fetch('/shop/status?order='+encodeURIComponent(order));const d=await r.json();if(!r.ok)throw Error(d.error||'查询暂不可用');const labels={PENDING:'等待付款确认，请勿重复付款',PAID:'已付款，正在准备检索结果',GENERATING:'已付款，正在检索，请稍后刷新',READY:'检索结果已交付',CLOSED:'订单已关闭'};s.textContent=(labels[d.state]||'订单状态待确认')+' · ¥'+d.amount+' · '+d.keywords;if(d.state==='READY'){const root=document.getElementById('results');root.replaceChildren();const notices=d.result?.notices||[];if(!notices.length){const p=document.createElement('p');p.textContent='本次未找到匹配公告。查询已完成；你可以调整关键词后另行查询。';root.append(p)}for(const n of notices){const a=document.createElement('article');const pre=document.createElement('pre');pre.textContent=[n.title||'未提供标题','采购方：'+(n.buyer_names||[]).join('、'),'发布日期：'+(n.publication_date||'未提供'),'截止日期：'+(n.deadlines||[]).join('、'),'公告编号：'+(n.publication_number||'未提供')].join('\n');a.append(pre);root.append(a)}}}catch(e){s.textContent=e.message+'。请保留订单，不要重复付款。'}finally{running=false;document.getElementById('refresh').disabled=false}}document.getElementById('refresh').onclick=update;update();
</script></html>
